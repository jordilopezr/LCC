[package]
name = "native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.38", features = ["serde"] }
dirs = "6.0.0"
flutter_rust_bridge = "=2.11.1"
lazy_static = "1.5.0"
regex = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ssh2 = "0.9.4"
tokio = { version = "1.48.0", features = ["rt", "time", "process", "io-util", "fs", "sync", "net", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2.3"

# Google Cloud Client Libraries - PoC
google-cloud-auth = "0.17"
google-cloud-googleapis = "0.14"
reqwest = { version = "0.12", features = ["json"] }

# Sprint 5: Windows Credentials
rsa = "0.9"
rand = "0.8"
keyring = "3"
base64 = "0.22"
num-bigint-dig = "0.8"
sha1 = "0.10"

# Sprint 10.5: License verification removed
