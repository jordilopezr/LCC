name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 27H1-preview.20261105.56). Empty: the one lib/src/version.dart describes. Dry run: builds + attests, no release.'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Runs before the builds so a bad tag fails in seconds, not after tens of
  # minutes of compiling. Every later job takes the version from here.
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          # All tags: the lifecycle check reads version.dart at the previous
          # stable's tag.
          fetch-depth: 0

      # Version comes from an externally-settable source (tag name or dispatch
      # input). Route it through env (never inline ${{ }} in the script) and
      # validate to a safe charset so it can never carry shell metacharacters
      # into later run: steps. A git tag may legally contain $(...) / backticks.
      - name: Derive version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            V="$VERSION_INPUT"
            [ -n "$V" ] || V="$(scripts/check_release_version.sh expected)"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$V" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "::error::Invalid version '$V' (allowed characters: A-Z a-z 0-9 . _ -)"
            exit 1
          fi
          # Format, and match with lib/src/version.dart: the update checker
          # reads edition, channel and build from the tag.
          scripts/check_release_version.sh consistency "$V" >> "$GITHUB_OUTPUT"
          echo "Building version: $V"

      # A dry run often rebuilds a version that is already published, which
      # this check rightly rejects; there it reports without failing the run.
      - name: Check release lifecycle
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft | not) | .tag_name' > published-tags.txt
          scripts/check_release_version.sh lifecycle "$VERSION" published-tags.txt

  build:
    name: Build (${{ matrix.image }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu
            scripts: 'package_deb.sh package_appimage.sh package_tarball.sh'
          - image: almalinux
            scripts: 'package_rpm.sh'
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          podman build -t "lcc-builder-$IMAGE" \
            -f "packaging/podman/Containerfile.$IMAGE" \
            packaging/podman

      - name: Run packaging scripts
        env:
          IMAGE: ${{ matrix.image }}
          SCRIPTS: ${{ matrix.scripts }}
          VERSION: ${{ needs.validate.outputs.version }}
          # Supplied to the build, never committed: a client secret sitting in a
          # public repository is one that credential scanners find and providers
          # revoke, which would break sign-in for everyone on a release. Absent,
          # the build has no native sign-in and falls back to the gcloud auth
          # engine. See native/build.rs.
          LCC_OAUTH_CLIENT_SECRET: ${{ secrets.LCC_OAUTH_CLIENT_SECRET }}
        run: |
          podman run --rm \
            -e VERSION="$VERSION" \
            -e SCRIPTS="$SCRIPTS" \
            -e LCC_OAUTH_CLIENT_SECRET="$LCC_OAUTH_CLIENT_SECRET" \
            -e LCC_REQUIRE_OAUTH_SECRET=1 \
            -v "$PWD:/workspace/src" \
            -w /workspace/src \
            "lcc-builder-$IMAGE" \
            bash -euo pipefail -c '
              for s in $SCRIPTS; do
                echo "=== Running scripts/$s ==="
                ./scripts/$s
              done
            '

      - name: Collect artifacts
        run: |
          mkdir -p out
          shopt -s nullglob
          for f in *.deb *.rpm *.AppImage *.tar.gz; do
            cp "$f" out/
          done
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.image }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build (macos)
    # Intel runner: the macos-15 (arm64) pool had no capacity and cancelled the
    # job unstarted twice. The output is the same either way: Flutter builds a
    # Universal Binary (arm64 + x86_64), and macos/build_rust.sh compiles the
    # Rust crate for both and lipo's them into native.framework.
    needs: validate
    runs-on: macos-15-intel
    env:
      # Same version as packaging/podman/Containerfile.*, so macOS and Linux
      # resolve the committed pubspec.lock identically.
      FLUTTER_VERSION: '3.41.1'
    steps:
      - uses: actions/checkout@v4

      # Installed from Google's release bucket, like the Linux containers do,
      # rather than through a third-party setup action. The x64 SDK, matching
      # the runner.
      - name: Install Flutter
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flutter.zip" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_${FLUTTER_VERSION}-stable.zip"
          unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Rust targets
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build app
        env:
          # See the Linux job and native/build.rs.
          LCC_OAUTH_CLIENT_SECRET: ${{ secrets.LCC_OAUTH_CLIENT_SECRET }}
          LCC_REQUIRE_OAUTH_SECRET: '1'
        run: |
          flutter --version
          flutter config --no-analytics
          flutter pub get
          flutter build macos --release

      - name: Verify Universal Binary
        run: |
          APP="build/macos/Build/Products/Release/Lightweight Cloud Connector.app"
          for bin in "$APP/Contents/MacOS/Lightweight Cloud Connector" \
                     "$APP/Contents/Frameworks/native.framework/native"; do
            archs=$(lipo -archs "$bin")
            echo "$bin: $archs"
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *)
              echo "::error::$bin is not universal ($archs)"; exit 1 ;;
            esac
          done
          codesign --verify --deep --strict "$APP"

      # Ad-hoc signed, not notarized: Gatekeeper warns on first launch
      # (right-click > Open). Developer ID signing + notarization can be added
      # here once an Apple Developer certificate is available as a secret.
      - name: Package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/Lightweight Cloud Connector.app" \
            "out/lightweight-cloud-connector_${VERSION}_macos-universal.zip"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attest & release
    needs: [validate, build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SPDX SBOM (source dependency graph)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifacts-*
          merge-multiple: true

      - name: Checksums
        run: |
          ( cd dist && sha256sum * ) > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: 'dist/*'
          sbom-path: sbom.spdx.json

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Set here, not by hand on publishing: the update checker keeps
          # preview builds away from stable-channel users by this flag and the
          # tag, and a forgotten checkbox would offer them a preview.
          PRERELEASE=()
          [ "$CHANNEL" = "preview" ] && PRERELEASE=(--prerelease)
          cat > release-notes.md <<'NOTES'
          ## Verifying this release

          Every artifact carries a keyless build-provenance attestation and an
          SPDX SBOM attestation (Sigstore-backed, no signing key). Verify a
          download before installing:

          ```bash
          # Build provenance (who / what commit / which workflow built it)
          gh attestation verify --repo jordilopezr/LCC <artifact>

          # SBOM (dependency graph that went into the build)
          gh attestation verify --repo jordilopezr/LCC \
            --predicate-type https://spdx.dev/Document/v2.3 <artifact>

          # Offline integrity
          sha256sum -c SHA256SUMS
          ```
          NOTES
          gh release create "$TAG" \
            --draft "${PRERELEASE[@]}" \
            --title "LCC $VERSION" \
            --notes-file release-notes.md \
            dist/* SHA256SUMS sbom.spdx.json
